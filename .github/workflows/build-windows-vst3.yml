name: Build LAB2576C VST3 for Windows x64

on:
  push:
    branches: [build/windows-vst3-0.1.2]

permissions:
  contents: read

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure for Windows x64
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64 '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'

      - name: Build the VST3 and DSP tests
        run: cmake --build build-win --config Release --parallel 4

      - name: Run the DSP tests
        run: ctest --test-dir build-win -C Release --output-on-failure --verbose

      - name: Validate the VST3 with pluginval
        run: |
          $bundle = (Resolve-Path 'build-win/LAB2576C_artefacts/Release/VST3/LAB2576C.vst3').Path
          $validatorZip = Join-Path $env:RUNNER_TEMP 'pluginval-windows.zip'
          $validatorDir = Join-Path $env:RUNNER_TEMP 'pluginval'
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile $validatorZip
          if ((Get-FileHash -Path $validatorZip -Algorithm SHA256).Hash -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') {
            throw 'The pluginval archive checksum differs from the expected digest.'
          }
          Expand-Archive -LiteralPath $validatorZip -DestinationPath $validatorDir
          $validator = Join-Path $validatorDir 'pluginval.exe'
          & $validator --strictness-level 5 --validate-in-process --validate $bundle | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the VST3 bundle
        run: |
          $bundle = 'build-win/LAB2576C_artefacts/Release/VST3/LAB2576C.vst3'
          $binary = Join-Path $bundle 'Contents/x86_64-win/LAB2576C.vst3'
          $resources = Join-Path $bundle 'Contents/Resources'
          if (!(Test-Path $binary -PathType Leaf)) { throw "Missing x64 VST3 module: $binary" }
          if (!(Test-Path (Join-Path $resources 'moduleinfo.json') -PathType Leaf)) { throw 'Missing VST3 module metadata.' }
          Copy-Item 'Resources/BarlowCondensed-OFL.txt' -Destination $resources
          Compress-Archive -LiteralPath $bundle -DestinationPath 'LAB2576C-0.1.2-Windows-x64-VST3.zip'
          Get-FileHash -Path 'LAB2576C-0.1.2-Windows-x64-VST3.zip' -Algorithm SHA256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: LAB2576C-0.1.2-Windows-x64-VST3.zip
          archive: false
          if-no-files-found: error
          retention-days: 7
